<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Tarot — Free Fortune</title>
    <meta
      name="description"
      content="Draw a free Crypto Tarot fortune. Seventy-eight cards, playful readings, no account and no payment. Entertainment only."
    />
    <meta property="og:title" content="Crypto Tarot — Free Fortune" />
    <meta
      property="og:description"
      content="A free, playful Crypto Tarot reading. Draw the cards and read your fortune. Entertainment only."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="tools/CryptoTarot1-78/Cardback-01.jpg" />
    <link rel="icon" href="assets/cosmic-journey-card.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="fortune-game">
    <main class="fortune-table">
      <header class="fortune-intro">
        <p class="fortune-kicker">Free to play</p>
        <h1>Crypto Tarot</h1>
        <p class="fortune-lede">
          Choose one card or three. Draw, watch the art turn over, then read what it means.
        </p>
      </header>

      <section class="fortune-panel" id="reading" aria-labelledby="reading-title">
        <h2 id="reading-title" class="visually-hidden">Your reading</h2>

        <label class="fortune-label" for="questionInput">
          Your question <span class="fortune-optional">optional</span>
        </label>
        <input
          id="questionInput"
          class="fortune-question-input"
          type="text"
          maxlength="180"
          placeholder="What should I pay attention to?"
          autocomplete="off"
        />

        <div class="fortune-draw-row">
          <div class="fortune-spread-field">
            <label class="fortune-label" for="spreadType">How many cards</label>
            <select id="spreadType" class="fortune-spread">
              <option value="1-card">One card</option>
              <option value="3-card" selected>Three cards</option>
            </select>
          </div>
          <button id="drawCardsBtn" class="btn btn-primary" type="button">Draw my fortune</button>
        </div>

        <p id="readingStatus" class="reading-status" role="status" aria-live="polite">
          The deck is shuffled and waiting.
        </p>

        <div id="readingCards" class="reading-cards" role="list">
          <figure class="reading-card is-preview" aria-hidden="true">
            <img src="tools/CryptoTarot1-78/Cardback-01.jpg" alt="" />
          </figure>
          <figure class="reading-card is-preview" aria-hidden="true">
            <img src="tools/CryptoTarot1-78/Cardback-03.jpg" alt="" />
          </figure>
          <figure class="reading-card is-preview" aria-hidden="true">
            <img src="tools/CryptoTarot1-78/Cardback-05.jpg" alt="" />
          </figure>
        </div>

        <div id="readingSkeleton" class="reading-skeleton" hidden aria-hidden="true"></div>
        <p id="readingText" class="reading-hint">Pick one card or three, then draw.</p>

        <div id="fortuneReading" class="fortune-reading"></div>

        <p class="fortune-quiet">
          <button id="viewHistoryBtn" class="text-btn" type="button">Past readings</button>
        </p>
      </section>

      <footer class="fortune-footer">
        <p>For entertainment only. Not financial advice.</p>
        <p>
          <a href="card-detail.html">Card guide</a>
        </p>
      </footer>
    </main>

    <div id="cardModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-dialog" role="document">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">×</button>
        <div class="modal-body">
          <img id="modalImg" alt="Selected tarot card" />
          <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalMeta" class="note"></p>
            <p id="modalCosmic" class="note"></p>
            <p id="modalCrypto" class="note"></p>
            <div class="modal-meanings">
              <p id="modalUpright"></p>
              <p id="modalReversed"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
